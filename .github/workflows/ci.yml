name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore WebApplication1/WebApplication1.sln

      - name: Build Docker image
        run: docker build -t task-manager-api ./WebApplication1

      - name: Build
        run: dotnet build WebApplication1/WebApplication1.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test WebApplication1/WebApplication1.sln --no-build --configuration Release
